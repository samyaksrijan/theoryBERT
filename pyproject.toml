[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theorybert"
version = "0.1.0"
description = "Verified visual explanations of formal languages"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.45,<5", "streamlit>=1.66,<2", "nltk>=3.9", "numpy>=1.26", "pandas>=2.2", "pyyaml>=6", "manim>=0.19,<0.23", "starlette>=1.0,<2", "uvicorn>=0.40,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.48"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
